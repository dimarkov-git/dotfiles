# Not on gpg-agent's default search path; without this it falls back to the
# TTY pinentry gnupg pulls in, which fails wherever there is no TTY.
pinentry-program /opt/homebrew/bin/pinentry-mac

# A workday: a rebase re-signs every commit and would otherwise prompt per commit.
default-cache-ttl 28800
max-cache-ttl 28800
